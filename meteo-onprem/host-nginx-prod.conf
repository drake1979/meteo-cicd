server {
    listen 443 ssl;
    listen 9443 ssl;
    server_name meteoapi.mvmetr.hu;

    client_max_body_size 5M;

    ssl_certificate     /etc/nginx/ssl/meteo.mvmetr.hu.crt;
    ssl_certificate_key /etc/nginx/ssl/meteo.mvmetr.hu.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location /api/Estimate/CreateCombinedEstimates {
        proxy_pass         http://localhost:53135/api/Estimate/CreateCombinedEstimates;
        proxy_read_timeout 24h;
    }

    location /api/ForecastSync/ImportForecasts {
        proxy_pass         http://localhost:53135/api/ForecastSync/ImportForecasts;
        proxy_read_timeout 24h;
    }

    location /api/ForecastSync/ImportSolcastZipForecasts {
        proxy_pass         http://localhost:53135/api/ForecastSync/ImportSolcastZipForecasts;
        proxy_read_timeout 24h;
    }

    location /api/MEKResponseService {
        proxy_pass         http://localhost:53135/api/MEKResponseService;
        proxy_read_timeout 10m;
    }

    location /health-python-be {
        rewrite /health-python-be / break;
        proxy_pass         http://localhost:5000;
    }

    location /health-be {
        rewrite /health-be /releasenotes.txt break;
        proxy_pass         http://localhost:53135;
    }

    location / {
        proxy_pass         http://localhost:53135;
        proxy_read_timeout 5m;
    }

    location /health {
        add_header 'Content-Type' 'text/plain';
        return 200 'HOST OK';
    }
}