parameters:
  - name: "serviceName"
    default: "meteo.backend.python"
    type: string

jobs:
  - job:
    displayName: ${{ parameters.serviceName }} build and publish

    variables:
      dotnetRoot: "$(Build.SourcesDirectory)/fiek-met/backend"

    steps:
      - checkout: self
      - checkout: cicd

      # - task: UsePythonVersion@0
      #   displayName: Use Python 3.7
      #   inputs:
      #     versionSpec: "3.7"
      #     addToPath: true
      #     architecture: "x64"

      # - task: Bash@3
      #   displayName: Run Python tests
      #   inputs:
      #     targetType: "inline"
      #     script: |
      #       export PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python
      #       pip install --upgrade pip
      #       python -m pip install --no-cache-dir -r $(Build.SourcesDirectory)/meteo-cicd/backend-python/requirements.txt
      #       python -m unittest
      #     workingDirectory: "$(dotnetRoot)/FIEK.MET.Backend.PythonService.Tests"

      - task: CopyFiles@2
        displayName: copy cicd files to publish
        inputs:
          sourceFolder: "$(Build.SourcesDirectory)/meteo-cicd/backend-python"
          contents: "**"
          targetFolder: "$(dotnetRoot)/FIEK.MET.Backend.PythonService"
          OverWrite: true

      - task: Bash@3
        displayName: "Get commit hash"
        inputs:
          targetType: "inline"
          script: |
            GIT_SHA=$(git rev-parse --short=8 HEAD)
            echo "##vso[task.setvariable variable=GIT_SHA]$GIT_SHA"
            echo "##vso[build.updatebuildnumber]$GIT_SHA"
          workingDirectory: $(Build.SourcesDirectory)/fiek-met

      - task: Docker@2
        displayName: METEO Push PythonService docker image to Azure repository
        condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
        inputs:
          containerRegistry: "MeteoCR"
          repository: "${{ parameters.serviceName }}"
          command: "buildAndPush"
          Dockerfile: "$(dotnetRoot)/FIEK.MET.Backend.PythonService/Dockerfile"
          tags: |
            latest
            $(GIT_SHA)

      - task: Docker@2
        displayName: ESCO-METEO Push PythonService docker image to Azure repository
        condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
        inputs:
          containerRegistry: "Esco-MeteoCR"
          repository: "${{ parameters.serviceName }}"
          command: "buildAndPush"
          Dockerfile: "$(dotnetRoot)/FIEK.MET.Backend.PythonService/Dockerfile"
          tags: |
            latest
            $(GIT_SHA)
